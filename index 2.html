<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Englert Inventory</title>
<style>
  :root {
    --amber: #FAC775;
    --amber-dark: #633806;
    --green-light: #E1F5EE;
    --green-dark: #085041;
    --gray-light: #F5F5F3;
    --gray-med: #888780;
    --border: #CCCCC4;
    --black: #1a1a18;
    --red: #A32D2D;
    --red-light: #FCEBEB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Helvetica, sans-serif; background: #f0efe9; min-height: 100vh; color: var(--black); }

  /* HEADER */
  .header { background: var(--amber); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 18px; font-weight: 700; color: var(--amber-dark); }
  .header .nav-btn { background: var(--amber-dark); color: var(--amber); border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }

  /* VIEWS */
  .view { display: none; padding: 20px; }
  .view.active { display: block; }

  /* CARDS */
  .card { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 13px; color: var(--gray-med); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* COUNT ENTRY FORM */
  .item-name { font-size: 48px; font-weight: 700; color: var(--black); line-height: 1; margin-bottom: 4px; }
  .color-name { font-size: 18px; color: var(--gray-med); margin-bottom: 20px; }
  .upb-badge { display: inline-block; background: var(--green-light); color: var(--green-dark); font-size: 14px; font-weight: 600; padding: 6px 14px; border-radius: 8px; margin-bottom: 24px; }

  .count-section { margin-bottom: 20px; }
  .count-label { font-size: 14px; font-weight: 600; color: var(--black); margin-bottom: 8px; }
  .count-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .count-input-group { background: var(--gray-light); border-radius: 10px; padding: 12px; }
  .count-input-group label { font-size: 11px; color: var(--gray-med); display: block; margin-bottom: 4px; }
  .count-input-group input { width: 100%; font-size: 28px; font-weight: 700; border: none; background: transparent; color: var(--black); outline: none; }

  .total-display { background: var(--green-light); border-radius: 10px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .total-display .label { font-size: 14px; color: var(--green-dark); font-weight: 600; }
  .total-display .value { font-size: 36px; font-weight: 700; color: var(--green-dark); }

  .submit-btn { width: 100%; background: var(--green-dark); color: white; border: none; border-radius: 12px; padding: 18px; font-size: 18px; font-weight: 700; cursor: pointer; }
  .submit-btn:active { opacity: 0.85; }
  .success-msg { display: none; background: var(--green-light); color: var(--green-dark); border-radius: 10px; padding: 14px; text-align: center; font-weight: 600; margin-top: 12px; }

  /* DASHBOARD */
  .dash-controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .dash-controls select { flex: 1; min-width: 120px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; }
  .dash-controls button { padding: 10px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: white; cursor: pointer; white-space: nowrap; }
  .dash-controls button.active { background: var(--amber); border-color: var(--amber-dark); color: var(--amber-dark); font-weight: 600; }

  .summary-bar { background: white; border-radius: 12px; border: 1px solid var(--border); padding: 16px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center; }
  .summary-bar .stat-label { font-size: 11px; color: var(--gray-med); }
  .summary-bar .stat-value { font-size: 22px; font-weight: 700; color: var(--black); }

  .inv-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .inv-table th { text-align: left; padding: 8px 10px; font-size: 11px; color: var(--gray-med); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
  .inv-table td { padding: 10px; border-bottom: 1px solid #f0efe9; }
  .inv-table tr:last-child td { border-bottom: none; }
  .inv-table .item-cell { font-weight: 600; }
  .inv-table .color-cell { color: var(--gray-med); font-size: 12px; }
  .inv-table .count-cell { font-weight: 700; color: var(--green-dark); text-align: right; }
  .inv-table .pending-cell { color: var(--gray-med); text-align: right; font-style: italic; }

  /* HOME */
  .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .color-btn { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: left; cursor: pointer; }
  .color-btn .cname { font-size: 15px; font-weight: 600; }
  .color-btn .cprog { font-size: 11px; color: var(--gray-med); margin-top: 2px; }
  .color-btn.complete { border-color: var(--green-dark); background: var(--green-light); }
  .color-btn.complete .cname { color: var(--green-dark); }

  .reset-btn { width: 100%; margin-top: 20px; background: var(--red-light); color: var(--red); border: 1px solid var(--red); border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }

  /* ITEM LIST */
  .item-list { display: flex; flex-direction: column; gap: 8px; }
  .item-row { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .item-row.counted { border-color: var(--green-dark); }
  .item-row .iname { font-size: 16px; font-weight: 600; }
  .item-row .icount { font-size: 18px; font-weight: 700; color: var(--green-dark); }
  .item-row .ipending { font-size: 14px; color: var(--gray-med); font-style: italic; }
  .back-btn { background: none; border: none; color: var(--amber-dark); font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1 id="header-title">Inventory</h1>
  <button class="nav-btn" id="nav-btn" onclick="showDashboard()">Dashboard</button>
</div>

<!-- HOME: color picker -->
<div class="view active" id="view-home">
  <div class="card" style="margin-bottom:16px">
    <div class="card-title">Select a color to count</div>
  </div>
  <div class="color-grid" id="color-grid"></div>
  <button class="reset-btn" onclick="confirmReset()">Reset all counts</button>
</div>

<!-- ITEM LIST for a color -->
<div class="view" id="view-items">
  <button class="back-btn" onclick="showHome()">← Back to colors</button>
  <div id="item-list-container"></div>
</div>

<!-- COUNT ENTRY -->
<div class="view" id="view-count">
  <button class="back-btn" id="back-to-items" onclick="backToItems()">← Back</button>
  <div class="card">
    <div class="color-name" id="entry-color"></div>
    <div class="item-name" id="entry-item"></div>
    <div class="upb-badge" id="entry-upb"></div>

    <div class="count-section">
      <div class="count-label">Locked stock (pre-counted boxes)</div>
      <div class="count-input-group" style="margin-bottom:10px">
        <label>Number of locked boxes</label>
        <input type="number" id="locked-boxes" min="0" placeholder="0" oninput="calcTotal()">
      </div>
    </div>

    <div class="count-section">
      <div class="count-label">Front of stack (open / partial)</div>
      <div class="count-row">
        <div class="count-input-group">
          <label>Full boxes</label>
          <input type="number" id="front-boxes" min="0" placeholder="0" oninput="calcTotal()">
        </div>
        <div class="count-input-group">
          <label>Loose units</label>
          <input type="number" id="loose-units" min="0" placeholder="0" oninput="calcTotal()">
        </div>
      </div>
    </div>

    <div class="total-display">
      <div class="label">Total units</div>
      <div class="value" id="total-units">0</div>
    </div>

    <button class="submit-btn" onclick="submitCount()">Save Count</button>
    <div class="success-msg" id="success-msg">✓ Count saved!</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="view" id="view-dashboard">
  <div class="summary-bar" id="summary-bar">
    <div><div class="stat-label">Colors done</div><div class="stat-value" id="s-colors">0/14</div></div>
    <div><div class="stat-label">Items counted</div><div class="stat-value" id="s-items">0</div></div>
    <div><div class="stat-label">Total units</div><div class="stat-value" id="s-total">0</div></div>
  </div>
  <div class="dash-controls">
    <select id="dash-color-filter" onchange="renderDashboard()">
      <option value="">All colors</option>
    </select>
    <button id="btn-all" class="active" onclick="setDashFilter('all')">All</button>
    <button id="btn-counted" onclick="setDashFilter('counted')">Counted</button>
    <button id="btn-pending" onclick="setDashFilter('pending')">Pending</button>
  </div>
  <div class="card" style="padding:0;overflow:hidden">
    <table class="inv-table">
      <thead><tr><th>Item</th><th>Color</th><th style="text-align:right">Units</th></tr></thead>
      <tbody id="dash-tbody"></tbody>
    </table>
  </div>
  <button class="reset-btn" onclick="confirmReset()">Reset all counts</button>
</div>

<script>
const COLORS = ["White","Coal Grey","Green","Brown","Wicker","Egg Shell","Musket","Cream","Tan","Terratone","Red","Clay","Ivory","Light Grey"];
const ITEMS = [
  {name:"A Elbow", upb:32, unit:"units"},
  {name:"B Elbow", upb:32, unit:"units"},
  {name:"C Elbow", upb:24, unit:"units"},
  {name:"Pipe Clip", upb:65, unit:"units"},
  {name:"Endcap Left", upb:44, unit:"units"},
  {name:"Endcap Right", upb:44, unit:"units"},
  {name:"Box Miter", upb:16, unit:"units"},
  {name:"Strip Miter", upb:20, unit:"units"},
  {name:"ISHV", upb:16, unit:"units"},
  {name:"Inline", upb:10, unit:"units"},
  {name:"Drain Defender", upb:15, unit:"units"},
  {name:"Big Mouth", upb:25, unit:"units"},
  {name:"Screws", upb:1, unit:"boxes"},
  {name:"Touch up Paint", upb:1, unit:"cans"},
  {name:"Trim Coil", upb:1, unit:"feet"},
];

let counts = {};
let currentColor = null;
let currentItem = null;
let dashFilter = 'all';

// --- STORAGE ---
function saveData() { try { localStorage.setItem('inv_counts', JSON.stringify(counts)); } catch(e){} }
function loadData() { try { const d = localStorage.getItem('inv_counts'); if(d) counts = JSON.parse(d); } catch(e){} }

function countKey(color, item) { return `${color}||${item}`; }
function getCount(color, item) { return counts[countKey(color,item)] ?? null; }
function setCount(color, item, val) { counts[countKey(color,item)] = val; saveData(); }

// --- VIEWS ---
function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showHome() {
  document.getElementById('header-title').textContent = 'Inventory';
  document.getElementById('nav-btn').textContent = 'Dashboard';
  document.getElementById('nav-btn').onclick = showDashboard;
  renderHome();
  showView('view-home');
}

function showDashboard() {
  document.getElementById('header-title').textContent = 'Dashboard';
  document.getElementById('nav-btn').textContent = 'Count';
  document.getElementById('nav-btn').onclick = showHome;
  renderDashboard();
  showView('view-dashboard');
}

function showItems(color) {
  currentColor = color;
  document.getElementById('header-title').textContent = color;
  document.getElementById('nav-btn').textContent = 'Dashboard';
  document.getElementById('nav-btn').onclick = showDashboard;
  renderItemList();
  showView('view-items');
}

function showCountEntry(color, item) {
  currentColor = color;
  currentItem = item;
  const itm = ITEMS.find(i => i.name === item);
  document.getElementById('entry-color').textContent = color.toUpperCase();
  document.getElementById('entry-item').textContent = item;
  document.getElementById('entry-upb').textContent = `Units per full box: ${itm.upb}`;
  document.getElementById('header-title').textContent = item;

  // Pre-fill if already counted
  const existing = getCount(color, item);
  document.getElementById('locked-boxes').value = '';
  document.getElementById('front-boxes').value = '';
  document.getElementById('loose-units').value = '';
  document.getElementById('total-units').textContent = existing !== null ? existing : '0';
  document.getElementById('success-msg').style.display = 'none';

  showView('view-count');
}

function backToItems() { showItems(currentColor); }

// --- RENDER HOME ---
function renderHome() {
  const grid = document.getElementById('color-grid');
  grid.innerHTML = '';
  COLORS.forEach(color => {
    const counted = ITEMS.filter(i => getCount(color,i.name) !== null).length;
    const complete = counted === ITEMS.length;
    const btn = document.createElement('button');
    btn.className = 'color-btn' + (complete ? ' complete' : '');
    btn.innerHTML = `<div class="cname">${color}</div><div class="cprog">${counted}/${ITEMS.length} items</div>`;
    btn.onclick = () => showItems(color);
    grid.appendChild(btn);
  });
}

// --- RENDER ITEM LIST ---
function renderItemList() {
  const container = document.getElementById('item-list-container');
  const counted = ITEMS.filter(i => getCount(currentColor, i.name) !== null).length;
  container.innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">${currentColor}</div>
      <div style="font-size:15px;font-weight:600">${counted} of ${ITEMS.length} items counted</div>
    </div>
    <div class="item-list" id="item-list"></div>`;
  const list = document.getElementById('item-list');
  ITEMS.forEach(itm => {
    const val = getCount(currentColor, itm.name);
    const row = document.createElement('div');
    row.className = 'item-row' + (val !== null ? ' counted' : '');
    row.innerHTML = `<div class="iname">${itm.name}</div>${val !== null ? `<div class="icount">${val.toLocaleString()}</div>` : '<div class="ipending">tap to count</div>'}`;
    row.onclick = () => showCountEntry(currentColor, itm.name);
    list.appendChild(row);
  });
}

// --- CALC TOTAL ---
function calcTotal() {
  const itm = ITEMS.find(i => i.name === currentItem);
  const locked = parseInt(document.getElementById('locked-boxes').value)||0;
  const front = parseInt(document.getElementById('front-boxes').value)||0;
  const loose = parseInt(document.getElementById('loose-units').value)||0;
  const total = (locked * itm.upb) + (front * itm.upb) + loose;
  document.getElementById('total-units').textContent = total.toLocaleString();
}

// --- SUBMIT COUNT ---
function submitCount() {
  const total = parseInt(document.getElementById('total-units').textContent.replace(/,/g,''))||0;
  setCount(currentColor, currentItem, total);
  const msg = document.getElementById('success-msg');
  msg.style.display = 'block';
  setTimeout(() => {
    msg.style.display = 'none';
    backToItems();
  }, 1200);
}

// --- DASHBOARD ---
function setDashFilter(f) {
  dashFilter = f;
  ['all','counted','pending'].forEach(x => {
    document.getElementById('btn-'+x).classList.toggle('active', x===f);
  });
  renderDashboard();
}

function renderDashboard() {
  // Populate color filter
  const sel = document.getElementById('dash-color-filter');
  if(sel.options.length === 1) {
    COLORS.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
  }
  const filterColor = sel.value;

  let totalUnits = 0, itemsCounted = 0;
  const colorsDone = COLORS.filter(c => ITEMS.every(i => getCount(c,i.name) !== null)).length;

  const tbody = document.getElementById('dash-tbody');
  tbody.innerHTML = '';

  COLORS.forEach(color => {
    if(filterColor && filterColor !== color) return;
    ITEMS.forEach(itm => {
      const val = getCount(color, itm.name);
      if(dashFilter === 'counted' && val === null) return;
      if(dashFilter === 'pending' && val !== null) return;
      if(val !== null) { totalUnits += val; itemsCounted++; }
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="item-cell">${itm.name}</td><td class="color-cell">${color}</td><td>${val !== null ? `<span class="count-cell">${val.toLocaleString()}</span>` : '<span class="pending-cell">—</span>'}</td>`;
      tr.style.cursor = 'pointer';
      tr.onclick = () => showCountEntry(color, itm.name);
      tbody.appendChild(tr);
    });
  });

  document.getElementById('s-colors').textContent = `${colorsDone}/${COLORS.length}`;
  document.getElementById('s-items').textContent = itemsCounted;
  document.getElementById('s-total').textContent = totalUnits.toLocaleString();
}

// --- RESET ---
function confirmReset() {
  if(confirm('Reset ALL counts? This cannot be undone.')) {
    counts = {};
    saveData();
    showHome();
  }
}

// --- URL PARAMS (for QR codes) ---
function checkURLParams() {
  const params = new URLSearchParams(window.location.search);
  const color = params.get('color');
  const item = params.get('item');
  if(color && item) {
    showCountEntry(decodeURIComponent(color), decodeURIComponent(item));
    return true;
  }
  return false;
}

// --- INIT ---
loadData();
if(!checkURLParams()) showHome();
</script>
</body>
</html>
